<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GREEN BYPASS</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    background:#020602;
    color:#00ff66;
    font-family:Consolas,monospace;
    padding:20px 0;
}

body:before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:repeating-linear-gradient(
        0deg,
        rgba(0,255,80,.025) 0px,
        rgba(0,255,80,.025) 1px,
        transparent 1px,
        transparent 4px
    );
}

.container{
    width:min(680px,94%);
    margin:auto;
}

.logo{
    text-align:center;
    font-size:30px;
    font-weight:bold;
    text-shadow:0 0 8px #00ff66,0 0 25px #00ff66;
    margin-bottom:5px;
}

.subtitle{
    text-align:center;
    color:#55ff99;
    font-size:12px;
    margin-bottom:20px;
}

.card{
    background:rgba(0,15,7,.95);
    border:1px solid #00ff66;
    border-radius:8px;
    padding:18px;
    margin-bottom:15px;
    box-shadow:0 0 15px rgba(0,255,80,.15);
}

.title{
    color:#fff;
    font-weight:bold;
    margin-bottom:12px;
}

input{
    width:100%;
    padding:13px;
    margin-top:7px;
    background:#000;
    color:#00ff66;
    border:1px solid #087936;
    border-radius:5px;
    outline:none;
    font-family:inherit;
}

input:focus{
    border-color:#00ff66;
    box-shadow:0 0 10px rgba(0,255,80,.3);
}

button{
    width:100%;
    padding:13px;
    margin-top:10px;
    border:0;
    border-radius:5px;
    background:#00ff66;
    color:#001b08;
    font-family:inherit;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    box-shadow:0 0 18px #00ff66;
}

button:disabled{
    opacity:.45;
    cursor:not-allowed;
}

.getCode{
    display:block;
    text-align:center;
    text-decoration:none;
    padding:12px;
    margin-top:10px;
    border:1px solid #00ff66;
    border-radius:5px;
    color:#00ff66;
    background:#031109;
}

.getCode:hover{
    background:#00ff66;
    color:#001b08;
}

.message{
    display:none;
    margin-top:12px;
    padding:12px;
    border-radius:5px;
    line-height:1.5;
}

.red{
    color:#ff3030;
    border:1px solid #ff3030;
    background:rgba(80,0,0,.2);
}

.green{
    color:#00ff66;
    border:1px solid #00ff66;
}

.sites{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
}

.site{
    padding:11px 5px;
    text-align:center;
    border:1px solid #075c2d;
    background:#031109;
    color:#70ff9c;
    border-radius:5px;
    cursor:pointer;
    font-size:13px;
}

.site.selected{
    background:#00ff66;
    color:#001b08;
    border-color:#00ff66;
    box-shadow:0 0 12px #00ff66;
}

.hidden{
    display:none;
}

.status-line{
    padding:6px 0;
    border-bottom:1px solid rgba(0,255,80,.08);
    font-size:13px;
}

.wait{
    color:#ffff55;
}

.ok{
    color:#00ff66;
}

.timer{
    text-align:center;
    font-size:36px;
    font-weight:bold;
    margin:12px;
    text-shadow:0 0 15px #00ff66;
}

.progress{
    height:8px;
    background:#001b09;
    border-radius:10px;
    overflow:hidden;
    border:1px solid #075c2d;
}

.progressBar{
    width:0%;
    height:100%;
    background:#00ff66;
    box-shadow:0 0 10px #00ff66;
    transition:width 1s linear;
}

.result{
    display:none;
    margin-top:15px;
    padding:14px;
    border:1px solid #ff3030;
    color:#ff3030;
    line-height:1.5;
}

.info{
    margin-top:12px;
    padding:10px;
    border:1px dashed #075c2d;
    color:#55ff99;
    font-size:12px;
}

.footer{
    text-align:center;
    color:#246b40;
    font-size:10px;
}

@media(max-width:500px){
    .sites{
        grid-template-columns:1fr;
    }

    .logo{
        font-size:24px;
    }
}
</style>
</head>

<body>

<div class="container">

<div class="logo">GREEN BYPASS</div>
<div class="subtitle">SECURE ACCESS SYSTEM</div>


<!-- =========================
     ĐĂNG NHẬP
========================= -->

<div class="card" id="loginCard">

    <div class="title">
        ▣ TRUY CẬP HỆ THỐNG
    </div>

    <div>
        Vui lòng nhập mã để truy cập
    </div>

    <input
        id="accessCode"
        type="text"
        placeholder="Nhập mã truy cập..."
        autocomplete="off"
    >

    <a
        class="getCode"
        id="getCode"
        href="https://lentop.one/ucb6ggk"
        target="_blank"
        rel="noopener noreferrer"
    >
        🔑 LẤY CODE
    </a>

    <button onclick="checkCode()">
        🔐 XÁC NHẬN MÃ
    </button>

    <div id="codeMessage" class="message"></div>

</div>


<!-- =========================
     TOOL
========================= -->

<div id="tool" class="hidden">

    <div class="card">

        <div class="title">
            ▣ CHỌN HỆ THỐNG XÁC NHẬN
        </div>

        <div class="sites">

            <div class="site" data-site="Gtraffic.io">
                Gtraffic.io
            </div>

            <div class="site" data-site="Link4m">
                Link4m
            </div>

            <div class="site" data-site="Layma.net">
                Layma.net
            </div>

            <div class="site" data-site="Traffic4k.com">
                Traffic4k.com
            </div>

            <div class="site" data-site="Site2s.com">
                Site2s.com
            </div>

            <div class="site" data-site="Bbmkt.com">
                Bbmkt.com
            </div>

            <div class="site" data-site="Ontop.link">
                Ontop.link
            </div>

        </div>

    </div>


    <div class="card">

        <div class="title">
            ▣ URL CẦN VƯỢT LINK
        </div>

        <input
            id="url"
            type="url"
            placeholder="Dán URL https:// của web cần vượt link"
        >

        <button id="bypass">
            ⚡ VƯỢT LINK
        </button>

        <div id="urlMessage" class="message"></div>

    </div>


    <!-- =========================
         TRẠNG THÁI
    ========================= -->

    <div class="card" id="statusCard" style="display:none">

        <div class="title">
            ▣ TRẠNG THÁI HỆ THỐNG
        </div>

        <div class="timer" id="timer">
            15
        </div>

        <div class="progress">
            <div
                class="progressBar"
                id="progressBar">
            </div>
        </div>

        <br>

        <div id="logs"></div>

        <div id="result" class="result"></div>

    </div>

</div>


<div class="footer">
GREEN BYPASS SYSTEM • DEMO
</div>

</div>


<script>

/* =====================================================
   LINK LẤY CODE
===================================================== */

const codePage =
    "https://lentop.one/ucb6ggk";

document.getElementById("getCode").href =
    codePage;


/* =====================================================
   MÃ TRUY CẬP
===================================================== */

const firstCode = "K8F2M9P4VT";

const secondCode = "7B9X3W1R5Z";

const validCodes = [
    "P4N8Q2Y6KD",
    "9J3C7V1M8L",
    "W5T2B9R4HX",
    "2M8G6K1P9S",
    "X7L3D9V4B2",
    "R1P9H5Z3C8",
    "4V8N2Q6M1K"
];


/* =====================================================
   KHÔI PHỤC TRẠNG THÁI SAU KHI F5
===================================================== */

function restoreAccess(){

    const access =
        localStorage.getItem(
            "greenBypassAccess"
        );

    if(access === "true"){

        document.getElementById("loginCard")
            .style.display = "none";

        document.getElementById("tool")
            .classList.remove("hidden");

    }

}


/* =====================================================
   KIỂM TRA CODE
===================================================== */

function checkCode(){

    const code =
        document.getElementById("accessCode")
        .value
        .trim();

    const msg =
        document.getElementById("codeMessage");

    msg.style.display = "block";


    /* Mã K8F2M9P4VT */

    if(code === firstCode){

        msg.className = "message red";

        msg.textContent =
            "Mã bạn cấp không chính xác. " +
            "Quay lại vào ngày mai.";

        return;
    }


    /* Mã mở khóa */

    if(code === secondCode){

        msg.className = "message green";

        msg.textContent =
            "Mã chính xác! Đang mở khóa...";

        setTimeout(openTool,700);

        return;
    }


    /* Các mã hợp lệ */

    if(validCodes.includes(code)){

        msg.className = "message green";

        msg.textContent =
            "Mã hợp lệ! Đang mở khóa...";

        setTimeout(openTool,700);

        return;
    }


    msg.className = "message red";

    msg.textContent =
        "Mã truy cập không hợp lệ.";

}


/* =====================================================
   MỞ TOOL + LƯU TRẠNG THÁI
===================================================== */

function openTool(){

    localStorage.setItem(
        "greenBypassAccess",
        "true"
    );

    document.getElementById("loginCard")
        .style.display = "none";

    document.getElementById("tool")
        .classList.remove("hidden");

    restoreSelectedSites();

}


/* =====================================================
   CHỌN SITE
===================================================== */

let selectedSites =
    JSON.parse(
        localStorage.getItem(
            "greenSelectedSites"
        ) || "[]"
    );


document.querySelectorAll(".site")
.forEach(site => {

    const name = site.dataset.site;


    /* Khôi phục site */

    if(selectedSites.includes(name)){

        site.classList.add("selected");

    }


    site.addEventListener("click", () => {

        site.classList.toggle("selected");


        if(site.classList.contains("selected")){

            if(!selectedSites.includes(name)){

                selectedSites.push(name);

            }

        }else{

            selectedSites =
                selectedSites.filter(
                    x => x !== name
                );

        }


        localStorage.setItem(
            "greenSelectedSites",
            JSON.stringify(selectedSites)
        );

    });

});


function restoreSelectedSites(){

    document.querySelectorAll(".site")
    .forEach(site => {

        if(
            selectedSites.includes(
                site.dataset.site
            )
        ){

            site.classList.add("selected");

        }

    });

}


/* =====================================================
   KIỂM TRA HTTPS
===================================================== */

function validHttps(value){

    try{

        const u = new URL(value);

        return u.protocol === "https:";

    }catch(e){

        return false;

    }

}


/* =====================================================
   LOG
===================================================== */

function addLog(text,type="ok"){

    const div =
        document.createElement("div");

    div.className =
        "status-line " + type;

    div.textContent = text;

    document.getElementById("logs")
        .appendChild(div);

}


/* =====================================================
   NÚT BYPASS
===================================================== */

document.getElementById("bypass")
.addEventListener("click", () => {

    const url =
        document.getElementById("url")
        .value
        .trim();

    const msg =
        document.getElementById("urlMessage");


    msg.style.display = "block";


    if(!url){

        msg.className = "message red";

        msg.textContent =
            "Vui lòng nhập URL.";

        return;

    }


    if(!validHttps(url)){

        msg.className = "message red";

        msg.textContent =
            "Chỉ chấp nhận dạng https://";

        return;

    }


    if(selectedSites.length === 0){

        msg.className = "message red";

        msg.textContent =
            "Vui lòng chọn ít nhất một hệ thống.";

        return;

    }


    /* Lưu URL */

    localStorage.setItem(
        "greenLastURL",
        url
    );


    msg.style.display = "none";


    const card =
        document.getElementById(
            "statusCard"
        );

    card.style.display = "block";


    document.getElementById("logs")
        .innerHTML =
        '<div class="status-line ok">' +
        'Trạng thái: Sẵn sàng' +
        '</div>';


    document.getElementById("result")
        .style.display = "none";


    const button =
        document.getElementById("bypass");

    button.disabled = true;


    let seconds = 15;


    const timer =
        document.getElementById("timer");

    const bar =
        document.getElementById(
            "progressBar"
        );


    timer.textContent = seconds;

    bar.style.width = "0%";


    addLog(
        "Đang kiểm tra kết nối...",
        "wait"
    );


    setTimeout(() => {

        addLog(
            "Kết nối thành công!",
            "ok"
        );

    },1000);


    setTimeout(() => {

        addLog(
            "Đang tải module...",
            "wait"
        );

    },2000);


    setTimeout(() => {

        addLog(
            "Tải module hoàn tất!",
            "ok"
        );

    },4000);


    setTimeout(() => {

        addLog(
            "Đang giả lập bypass...",
            "wait"
        );

    },6000);


    setTimeout(() => {

        addLog(
            "Bỏ qua xác thực...",
            "wait"
        );

    },8000);


    setTimeout(() => {

        addLog(
            "Đang xác nhận...",
            "wait"
        );

    },10000);


    const interval =
        setInterval(() => {

            seconds--;

            timer.textContent =
                seconds;

            bar.style.width =
                ((15 - seconds) / 15 * 100) +
                "%";


            if(seconds <= 0){

                clearInterval(interval);

                finish();

            }

        },1000);

});


/* =====================================================
   KẾT QUẢ
===================================================== */

function finish(){

    document.getElementById("timer")
        .textContent = "✓";


    document.getElementById(
        "progressBar"
    ).style.width = "100%";


    addLog(
        "Bypass thành công!",
        "ok"
    );


    addLog(
        "Bạn đã vượt qua giới hạn!",
        "ok"
    );


    const result =
        document.getElementById("result");


    result.style.display = "block";


    /*
       85% lỗi kết nối
       15% Error 404
    */

    if(Math.random() < 0.85){

        result.innerHTML =
            "<b>LỖI KẾT NỐI THIẾT BỊ</b><br><br>" +
            "Lỗi kết nối thiết bị, vui lòng " +
            "kiểm tra kết nối mạng của bạn.";

    }else{

        result.innerHTML =
            "<b>ERROR 404</b><br><br>" +
            "Web ghi error 404 — " +
            "do not accept this action.";

    }


    document.getElementById("bypass")
        .disabled = false;

}


/* =====================================================
   KHÔI PHỤC KHI TRANG VỪA LOAD
===================================================== */

restoreAccess();


/* Khôi phục URL */

const savedURL =
    localStorage.getItem(
        "greenLastURL"
    );

if(savedURL){

    document.getElementById("url")
        .value = savedURL;

}

</script>

</body>
</html>
